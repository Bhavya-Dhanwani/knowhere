apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-deployment
  labels:
    name: media-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media
  template:
    metadata:
      labels:
        app: media
    spec:
      containers:
        - image: media-image
          name: media-main
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: '120m'
              memory: '120M'
            limits:
              cpu: '250m'
              memory: '250M'
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 5
          env:
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: ACCESS_TOKEN_SECRET
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: database
                  key: MEDIA_DB
            - name: PORT
              value: '5003'
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: AWS_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_RAW_BUCKET
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: S3_RAW_BUCKET
            - name: S3_TRANSCODED_BUCKET
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: S3_TRANSCODED_BUCKET
            - name: CLOUDFRONT_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: media-secrets
                  key: CLOUDFRONT_DOMAIN
          ports:
            - containerPort: 5003
              name: http
