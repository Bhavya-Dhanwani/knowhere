apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-runner-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: code-runner
  template:
    metadata:
      labels:
        app: code-runner
    spec:
      automountServiceAccountToken: false
      containers:
        - name: runner
          image: code-runner-service
          env:
            - name: CODING_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coding-runner
                  key: token
          ports:
            - containerPort: 7001
          resources:
            requests: { cpu: '250m', memory: '256Mi' }
            limits: { cpu: '1', memory: '768Mi' }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: code-runner-service
spec:
  selector:
    app: code-runner
  ports:
    - port: 7001
      targetPort: 7001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: code-runner-isolation
spec:
  podSelector:
    matchLabels:
      app: code-runner
  policyTypes: ['Ingress', 'Egress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: coding
      ports:
        - protocol: TCP
          port: 7001
  egress: []
