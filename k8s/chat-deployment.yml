apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-deployment
  labels:
    name: chat-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - image: chat-service
          name: chat-main
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: '120m'
              memory: '120M'
            limits:
              cpu: '250m'
              memory: '250M'
          livenessProbe:
            httpGet:
              path: /health
              port: 5007
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5007
            initialDelaySeconds: 10
            periodSeconds: 5
          env:
            - name: ACCESS_TOKEN_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-keys
                  key: ACCESS_TOKEN_PUBLIC_KEY
            - name: SERVICE_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-keys
                  key: SERVICE_TOKEN_SECRET
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: database
                  key: AUTH_DB # same cluster; MONGO_DB_NAME picks the chat database
            - name: MONGO_DB_NAME
              value: 'chatService'
            - name: USER_SERVICE_URL
              value: 'http://user-service'
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit
                  key: LIVEKIT_API_SECRET
            - name: LIVEKIT_URL
              valueFrom:
                secretKeyRef:
                  name: livekit
                  key: LIVEKIT_URL
            - name: REDIS_URL
              value: 'redis://redis-service:6379'
            - name: PORT
              value: '5007'
            - name: NODE_ENV
              value: 'production'
          ports:
            - containerPort: 5007
              name: http
