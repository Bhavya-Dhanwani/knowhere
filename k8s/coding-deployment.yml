apiVersion: apps/v1
kind: Deployment
metadata:
  name: coding-deployment
  labels:
    name: coding-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coding
  template:
    metadata:
      labels:
        app: coding
    spec:
      containers:
        - image: coding-service
          name: coding-main
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: '120m'
              memory: '120M'
            limits:
              cpu: '250m'
              memory: '250M'
          livenessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 10
            periodSeconds: 5
          env:
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth
                  key: ACCESS_TOKEN_SECRET
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: database
                  key: CODING_DB
            - name: REDIS_URL
              value: 'redis://redis-service:6379'
            - name: CODING_RUNNER_URL
              value: 'http://code-runner-service:7001/execute'
            - name: CODING_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coding-runner
                  key: token
            - name: USER_SERVICE_URL
              value: 'http://user-service:80'
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-services
                  key: token
            - name: PORT
              value: '5005'
            - name: NODE_ENV
              value: 'production'
          ports:
            - containerPort: 5005
              name: http
