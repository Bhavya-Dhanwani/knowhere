# Sandboxed runner for Python / C++ / Java submissions. Not privileged: it runs as a non-root user
# with no capabilities; seccomp/AppArmor are unconfined only so bubblewrap can create the per-run
# user namespaces. Learner code runs as nobody, no capabilities, no network (see server.mjs).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge-deployment
  labels:
    name: judge-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: judge
  template:
    metadata:
      labels:
        app: judge
    spec:
      automountServiceAccountToken: false
      containers:
        - image: judge-runner
          name: judge-main
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          env:
            - name: JUDGE_CONCURRENCY
              value: '2'
          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '2'
              memory: '2Gi'
          readinessProbe:
            httpGet:
              path: /health
              port: 5010
          livenessProbe:
            httpGet:
              path: /health
              port: 5010
            periodSeconds: 20
          ports:
            - containerPort: 5010
              name: http
---
kind: Service
apiVersion: v1
metadata:
  name: judge-service
spec:
  selector:
    app: judge
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 5010
---
# only the course and coding services may call the judge, and the judge may call nobody
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: judge-isolation
spec:
  podSelector:
    matchLabels:
      app: judge
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [course, coding]
      ports:
        - port: 5010
  egress: []
