apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowhere-ingress
  labels:
    app.kubernetes.io/name: knowhere-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - pathType: Prefix
            path: '/api/auth'
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - pathType: Prefix
            path: '/api/users'
            backend:
              service:
                name: user-service
                port:
                  number: 80
