# Serves the SPA and proxies the API when the app is reached through this container
# (e.g. `kubectl port-forward svc/frontend-service 3000:80`). Mirrors k8s/ingress.yml.
# nginx picks the longest matching prefix, so /api/course and /api/courses never collide.

# WebSocket upgrade for Socket.IO (realtime chat, presence, notifications)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # chat file uploads go through the API (10MB limit in chat-service)
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # auth-service
    location /api/auth       { proxy_pass http://auth-service:80; }
    location /docs           { proxy_pass http://auth-service:80; }
    location /openapi.json   { proxy_pass http://auth-service:80; }

    # user-service
    location /api/profile     { proxy_pass http://user-service:80; }
    location /api/profiles    { proxy_pass http://user-service:80; }
    location /api/competencies { proxy_pass http://user-service:80; }
    location /api/memberships { proxy_pass http://user-service:80; }

    # course-service: /api/courses (courses, progress) and /api/course (authoring, content, video)
    location /api/courses {
        proxy_pass http://course-service:80;
    }
    location /api/course {
        proxy_pass http://course-service:80;
        # encrypted video segments and code judging can take a while
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # chat-service REST + Socket.IO
    location /api/chat {
        proxy_pass http://chat-service:80;
    }
    location /socket.io/ {
        proxy_pass http://chat-service:80;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # standalone services
    location /api/questions { proxy_pass http://mcq-service:80; }
    location /api/coding    { proxy_pass http://coding-service:80; }
    location /api/resources { proxy_pass http://media-service:80; }
    location /api/review    { proxy_pass http://project-review-service:80; proxy_read_timeout 300s; }

    # object storage (presigned uploads, downloads, video segments): same origin, so no CORS.
    # Host keeps the port, because it is part of the presigned signature.
    location ~ ^/(lms-raw-media|lms-transcoded-media)/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # an unknown API path must fail loudly as JSON, never fall through to index.html
    location /api/ {
        default_type application/json;
        return 404 '{"success":false,"message":"Unknown API route"}';
    }

    # SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
