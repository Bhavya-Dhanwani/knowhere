services:
  mongodb:
    image: mongo:7
    container_name: knowhere-mongo
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: knowhere
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:''rs0'',members:[{_id:0,host:''mongodb:27017''}]}).ok }" | grep 1'
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: knowhere-redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: packages/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/authService?replicaSet=rs0
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET}
    depends_on:
      - mongodb

  user-service:
    build:
      context: .
      dockerfile: packages/user-service/Dockerfile
    container_name: user-service
    ports:
      - '5001:5001'
    environment:
      - PORT=5001
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/userService?replicaSet=rs0
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
    depends_on:
      - mongodb

  course-service:
    build:
      context: .
      dockerfile: packages/course-service/Dockerfile
    container_name: course-service
    ports:
      - '5002:5002'
    environment:
      - PORT=5002
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/courseService?replicaSet=rs0
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      - USER_SERVICE_URL=http://user-service:5001
      - MEDIA_SERVICE_URL=http://media-service:5003
      - MCQ_SERVICE_URL=http://mcq-service:5004
      - CODING_SERVICE_URL=http://coding-service:5005
    depends_on:
      - mongodb

  media-service:
    build:
      context: .
      dockerfile: packages/media-service/Dockerfile
    container_name: media-service
    ports:
      - '5003:5003'
    environment:
      - PORT=5003
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/mediaService?replicaSet=rs0
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET}
      - USER_SERVICE_URL=http://user-service:5001
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      - AWS_REGION=${AWS_REGION:?Set AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      - S3_RAW_BUCKET=${S3_RAW_BUCKET:?Set S3_RAW_BUCKET}
      - S3_TRANSCODED_BUCKET=${S3_TRANSCODED_BUCKET:?Set S3_TRANSCODED_BUCKET}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN:?Set CLOUDFRONT_DOMAIN}
      - MEDIACONVERT_ENDPOINT=${MEDIACONVERT_ENDPOINT:?Set MEDIACONVERT_ENDPOINT}
      - MEDIACONVERT_ROLE_ARN=${MEDIACONVERT_ROLE_ARN:?Set MEDIACONVERT_ROLE_ARN}
    depends_on:
      - mongodb

  mcq-service:
    build:
      context: .
      dockerfile: packages/mcq-service/Dockerfile
    container_name: mcq-service
    ports:
      - '5004:5004'
    environment:
      - PORT=5004
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/mcqService?replicaSet=rs0
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET}
      - USER_SERVICE_URL=http://user-service:5001
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
    depends_on:
      - mongodb

  coding-service:
    build:
      context: .
      dockerfile: packages/coding-service/Dockerfile
    container_name: coding-service
    ports:
      - '5005:5005'
    environment:
      - PORT=5005
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/codingService?replicaSet=rs0
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET}
      - USER_SERVICE_URL=http://user-service:5001
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      - REDIS_URL=redis://redis:6379
      - CODING_RUNNER_URL=http://code-runner-service:7001/execute
      - CODING_RUNNER_TOKEN=${CODING_RUNNER_TOKEN:?Set CODING_RUNNER_TOKEN}
    depends_on:
      - mongodb
      - redis
      - code-runner-service
    networks:
      - default
      - runner_net

  code-runner-service:
    build:
      context: .
      dockerfile: packages/code-runner-service/Dockerfile
    environment:
      - PORT=7001
      - CODING_RUNNER_TOKEN=${CODING_RUNNER_TOKEN:?Set CODING_RUNNER_TOKEN}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.0
    networks:
      - runner_net

  project-review-service:
    build:
      context: .
      dockerfile: packages/project-review-service/Dockerfile
    container_name: project-review-service
    ports:
      - '5006:5006'
    environment:
      - PORT=5006
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/projectReviewService?replicaSet=rs0
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET}
      - CORS_ORIGIN=*
      - TEMPORAL_ADDRESS=temporal:7233
      - REDIS_URL=redis://redis:6379
      - EVALUATION_RUNNER_TOKEN=${EVALUATION_RUNNER_TOKEN:?Set EVALUATION_RUNNER_TOKEN}
      - STATIC_ANALYSIS_RUNNER_URL=http://evaluation-runner-service:7002/static
      - EXECUTION_EVALUATION_RUNNER_URL=http://evaluation-runner-service:7002/execute
      - BROWSER_EVALUATION_RUNNER_URL=http://evaluation-runner-service:7002/browser
      - API_EVALUATION_RUNNER_URL=http://evaluation-runner-service:7002/api
    depends_on:
      - mongodb
      - redis
      - evaluation-runner-service
    networks:
      - default
      - evaluation_net

  evaluation-runner-service:
    build:
      context: .
      dockerfile: packages/evaluation-runner-service/Dockerfile
    environment:
      - PORT=7002
      - EVALUATION_RUNNER_TOKEN=${EVALUATION_RUNNER_TOKEN:?Set EVALUATION_RUNNER_TOKEN}
    read_only: true
    tmpfs:
      - /tmp:size=2g,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 3g
    cpus: 2.0
    networks:
      - evaluation_net

volumes:
  mongo_data:
  redis_data:

networks:
  runner_net:
    internal: true
  evaluation_net:
